/* Visual polish pass: quieter editorial hospitality system */
:root {
  font-size: 90%;
  --radius: 10px;
  --shadow: 0 10px 24px rgba(36, 40, 32, 0.07);
  --shadow-soft: 0 5px 16px rgba(36, 40, 32, 0.05);
}

html { font-size: 90%; }
body { font-size: 0.9rem; line-height: 1.75; }
.container { width: min(1160px, calc(100% - 64px)); }

/* Type: slightly smaller, with clearer hierarchy and less “template” scale */
h1 { font-size: clamp(38px, 4.7vw, 64px); margin-bottom: 22px; }
h2 { font-size: clamp(29px, 3.1vw, 43px); margin-bottom: 18px; }
h3 { font-size: 16px; }
.eyebrow { font-size: 9px; letter-spacing: .2em; }
p { max-width: 62ch; }

/* Buttons and controls: boxy, tactile, less pill-shaped */
.btn {
  border-radius: 4px;
  padding: 11px 17px;
  min-height: 42px;
  letter-spacing: .01em;
  transition: transform 160ms cubic-bezier(.23,1,.32,1), background-color 160ms ease, border-color 160ms ease;
}
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: scale(.97); }
.btn-light, .btn-outline { border-radius: 4px; }
.text-link { border-bottom-width: 1px; }

/* Header: flatter, lighter, with less floating UI */
.site-header { height: 76px; backdrop-filter: blur(8px); background: rgba(247,245,239,.96); }
.brand { font-size: 23px; }
.nav { gap: 21px; }

/* Hero: reduce the oversized frame and replace the strong gradient with a quiet wash */
.hero { padding-top: 20px; }
.hero-frame { min-height: 500px; border-radius: 12px; }
.hero-photo:after { background: rgba(246,242,233,.64); }
.hero-copy { max-width: 540px; padding: 72px 7% 126px; }
.hero-copy p { color: #4f554b; }
.search-panel { margin-top: -38px; width: calc(100% - 128px); padding: 13px; border-radius: 8px; box-shadow: var(--shadow); gap: 6px; }
.search-panel .btn { border-radius: 4px; }
.field { padding: 0 12px; }

/* Cards: smaller footprints, more intentional internal breathing room */
.property-grid { gap: 18px; }
.property-card, .article-card { border-radius: 8px; box-shadow: none; }
.property-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-soft); }
.property-image { height: 208px; }
.property-body { padding: 17px 18px 19px; }
.pill { top: 12px; left: 12px; border-radius: 4px; padding: 5px 8px; }
.heart { top: 10px; right: 10px; width: 32px; height: 32px; border-radius: 4px; }
.meta { gap: 10px; padding: 10px 0; }
.guide-grid { gap: 14px; }
.guide-card { height: 224px; border-radius: 8px; }
.guide-card:after { background: rgba(21,28,21,.42); }
.guide-copy { bottom: 16px; left: 16px; }
.guide-copy h3 { font-size: 20px; }
.article-card .property-image { height: 192px; }
.article-card .property-body { padding: 17px 18px 20px; }

/* Sections and feature modules: more whitespace, less visual mass */
.section { padding: 96px 0; }
.section-head { margin-bottom: 38px; }
.split { gap: 76px; }
.split-image { height: 430px; border-radius: 10px; }
.split-image .image-caption { bottom: 14px; left: 14px; border-radius: 4px; padding: 10px 12px; }
.benefits { gap: 26px; margin: 34px 0; }
.quote-section { background: #eeece5; }
.quote-grid { gap: 82px; }
.quote-card { padding: 30px 32px; border-radius: 8px; box-shadow: none; }
.quote-card blockquote { font-size: 22px; }
.cta-band { border-radius: 8px; padding: 38px 42px; }
.cta-band h2 { font-size: 34px; }

/* Secondary pages and forms */
.page-hero { padding: 72px 0 52px; }
.page-hero h1 { font-size: clamp(38px, 4.6vw, 58px); }
.filter-bar { padding: 30px 0; gap: 8px; }
.filter-bar input, .filter-bar select, .form-control,
.form-group input, .form-group select, .form-group textarea { border-radius: 4px; padding: 11px 12px; }
.detail-grid { gap: 56px; padding-top: 30px; }
.gallery { border-radius: 8px; gap: 7px; }
.booking-card { border-radius: 8px; padding: 24px; box-shadow: var(--shadow-soft); }

e.</p></div><div class="benefit"><strong>03 · A little flexibility</strong><p>Options for quick getaways and longer stays alike.</p></div><div class="benefit"><strong>04 · Human support</strong><p>Friendly, responsive help throughout your stay.</p></div></div><a class="btn" href="#why-us" data-page="why-us">Why stay with us ↗</a></div><div class="split-image">${img('https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?auto=format&fit=crop&w=1200&q=85','Warm living room with natural textures')}<div class="image-caption">A softer landing in the city.</div></div></div></section><section class="section quote-section"><div class="container quote-grid"><div><div class="eyebrow">Kind words, real stays</div><h2>Good stays stay with you.</h2><p>We want every guest to feel looked after, comfortable and glad they chose us.</p><a class="text-link" href="#why-us" data-page="why-us">What makes us different ↗</a></div><div class="quote-card"><div class="stars">★★★★★</div><blockquote>“The apartment felt like home from the moment we walked in. Beautifully kept, easy to settle into, and the team was so helpful.”</blockquote><div class="person">Guest review <small>Recent Nairobi stay</small></div></div></div></section><section class="section"><div class="container"><div class="section-head"><div><div class="eyebrow">Get to know the neighbourhood</div><h2>Make yourself at home in Nairobi.</h2></div><a class="text-link" href="#experiences" data-page="experiences">Discover the city ↗</a></div><div class="guide-grid">${guides.slice(0,4).map(g=>`<a class="guide-card" href="#guide/${g.id}" data-guide="${g.id}">${img(g.img,g.title)}<div class="guide-copy"><small>${g.cat}</small><h3>${g.title}</h3></div></a>`).join('')}</div></div></section><section class="section" style="padding-top:0"><div class="container"><div class="cta-band"><div><div class="eyebrow" style="color:#e0e5db">For property owners</div><h2>Your property. Our expertise.</h2><p>Thoughtful property management, with your returns and your home in mind.</p></div><a class="btn" href="#management" data-page="management">Explore property management ↗</a></div></div></section></main>`}
function stays(){let list=properties.filter(p=>(!state.filter.q||(p.name+' '+p.area+' '+p.type).toLowerCase().includes(state.filter.q.toLowerCase()))&&(state.filter.area==='All locations'||p.area===state.filter.area)&&(state.filter.beds==='Any bedrooms'||p.beds>=+state.filter.beds)&&p.price<=state.filter.max);if(state.filter.sort==='price-low')list.sort((a,b)=>a.price-b.price);if(state.filter.sort==='price-high')list.sort((a,b)=>b.price-a.price);return `<main><section class="page-hero"><div class="container"><div><div class="eyebrow">Find your place</div><h1>Our stays.</h1><p>Considered apartments in Nairobi, with the comforts of home and space to make the city your own.</p></div><a class="btn" href="#contact" data-page="contact">Need a recommendation? ↗</a></div></section><section class="section"><div class="container"><div class="filter-bar"><input id="filter-q" placeholder="Search by name or neighbourhood…" value="${state.filter.q}"><select id="filter-area"><option ${state.filter.area==='All locations'?'selected':''}>All locations</option>${['Kilimani','Westlands','Kileleshwa','Lavington'].map(x=>`<option ${state.filter.area===x?'selected':''}>${x}</option>`).join('')}</select><select id="filter-beds"><option>Any bedrooms</option>${[1,2,3].map(n=>`<option value="${n}" ${state.filter.beds==n?'selected':''}>${n}+ bedroom${n>1?'s':''}</option>`).join('')}</select><select id="filter-max"><option value="10000">Any monthly price</option><option value="1500" ${state.filter.max==1500?'selected':''}>Up to KES 1,500</option><option value="2500" ${state.filter.max==2500?'selected':''}>Up to KES 2,500</option><option value="3500" ${state.filter.max==3500?'selected':''}>Up to KES 3,500</option></select><select id="filter-sort"><option value="featured">Featured</option><option value="price-low" ${state.filter.sort==='price-low'?'selected':''}>Price: low to high</option><option value="price-high" ${state.filter.sort==='price-high'?'selected':''}>Price: high to low</option></select><span class="results-count">${list.length} stays</span></div><div class="property-grid" id="listing-grid">${list.length?list.map(card).join(''):`<div class="empty-state"><h3>No stays found just yet</h3><p>Try a different neighbourhood or broaden your price range.</p><button class="btn btn-light" data-action="reset-filters">Clear filters</button></div>`}</div></div></section></main>`}
function detail(id){let p=properties.find(x=>x.id===id)||properties[0];state.modalProperty=p.id;return `<main><div class="container"><div style="padding:25px 0 0;font-size:11px;color:var(--muted)"><a href="#home" data-page="home">Home</a> / <a href="#stays" data-page="stays">Our stays</a> / ${p.name}</div><div class="detail-grid"><div><div class="gallery">${p.imgs.map((src,i)=>`<button data-image="${src}" aria-label="View property photo ${i+1}">${img(src,p.name+' interior '+(i+1))}</button>`).join('')}</div><div class="detail-content"><div class="detail-section"><div class="location">${p.area} · NAIROBI, KENYA</div><h2>${p.name}</h2><div class="meta" style="border-top:0;padding-top:0"><span>★ ${p.rating} guest rating</span><span>${p.beds} bedrooms</span><span>${p.baths} bathrooms</span><span>Up to ${p.guests} guests</span></div><p>${p.desc}</p></div><div class="detail-section"><h3>The details that make it feel like home</h3><div class="amenity-grid">${p.amenities.map(a=>`<span>${a}</span>`).join('')}</div></div><div class="detail-section"><h3>Good to know</h3><p>Check-in details are shared after your booking is confirmed. Please treat the apartment and neighbours with care. Smoking and events are not permitted unless agreed in writing.</p><p>Location: ${p.address}. The exact address and arrival instructions will be provided after confirmation.</p></div><div class="detail-section"><h3>Availability</h3><p>Choose your preferred dates in the enquiry panel. Our team will confirm availability before your reservation is finalised.</p><div id="calendar" class="calendar"></div><p style="font-size:10px">Availability shown here is a demo calendar. Final dates require confirmation from the Pretty Fly Living team.</p></div><div class="detail-section"><h3>Frequently asked about this stay</h3><details class="accordion"><summary>Can I stay for a month or longer?</summary><p>Yes, this home is suitable for extended stays. Send your dates and our team will confirm the best available rate.</p></details><details class="accordion"><summary>Is the booking confirmed when I submit a request?</summary><p>No. A request is not a confirmed reservation. Our team will contact you to verify dates, pricing and next steps.</p></details><details class="accordion"><summary>How do I receive check-in instructions?</summary><p>We share arrival details and access instructions after your reservation is confirmed.</p></details></div><div class="detail-section"><h3>Explore similar stays</h3><div class="property-grid" style="grid-template-columns:1fr 1fr">${properties.filter(x=>x.id!==p.id).slice(0,2).map(card).join('')}</div></div></div></div><aside><div class="booking-card"><div class="price">${money(p.price)} <small>/ month</small></div><p style="font-size:11px;margin:5px 0 15px">Ask about your dates  -  no payment is taken here.</p><form id="booking-form" data-pid="${p.id}"><label for="book-in">Check-in date</label><input class="form-control" id="book-in" type="date" required><label for="book-out">Check-out date</label><input class="form-control" id="book-out" type="date" required><label for="book-guests">Guests</label><select class="form-control" id="book-guests">${Array.from({length:p.guests},(_,i)=>`<option value="${i+1}">${i+1} guest${i?'s':''}</option>`).join('')}</select><label for="book-name">Your name</label><input class="form-control" id="book-name" required placeholder="Full name"><label for="book-email">Email or phone</label><input class="form-control" id="book-email" required placeholder="How can we reach you?"><button class="btn" type="submit">Request to book ↗</button><button class="btn btn-light" type="button" data-action="whatsapp-property" data-pid="${p.id}" style="width:100%;margin-top:9px">Ask us on WhatsApp</button><p class="booking-note">Your request is not a confirmed reservation.</p><div id="booking-status" class="form-status"></div></form></div></aside></div></div><div class="mobile-book"><div class="price">${money(p.price)} <small>/ month</small></div><button class="btn" data-action="scroll-booking">Request to book ↗</button></div></main>`}
function why(){return `<main><section class="page-hero"><div class="container"><div><div class="eyebrow">The Pretty Fly approach</div><h1>A stay that feels<br>like you.</h1><p>We bring together inviting spaces, thoughtful details and genuinely helpful hospitality  -  so you can focus on what brought you to Nairobi.</p></div><a class="btn" href="#stays" data-page="stays">Find your stay ↗</a></div></section><section class="section"><div class="container split"><div><div class="eyebrow">A little more considered</div><h2>Comfort should come naturally.</h2><p>Pretty Fly Living is built around a simple idea: where you stay shapes how you experience a place. Our aim is to make every arrival easier, every day more comfortable, and every guest feel welcome.</p><p>From the neighbourhood we recommend to the small details in your apartment, we put care into the parts of a stay that matter.</p><a class="btn" href="#stays" data-page="stays">Explore our stays ↗</a></div><div class="split-image">${img('https://images.unsplash.com/photo-1600607687644-c7171b42498f?auto=format&fit=crop&w=1200&q=85','Calm, warm and thoughtfully furnished living space')}</div></div></section><section class="section" style="background:#eeece3"><div class="container"><div class="section-head"><div><div class="eyebrow">What you can expect</div><h2>The details matter.</h2></div></div><div class="service-grid">${[['⌂','Thoughtful locations','Neighbourhoods that make it easy to get where you need to go.'],['✳','Comfort-first spaces','Furnished apartments with the essentials for real everyday living.'],['♡','Responsive support','A real team ready to help with questions before and during your stay.'],['◷','Flexible options','Tell us what your trip needs, from a few nights to a longer stay.'],['✓','Clear communication','Straightforward booking enquiries and practical arrival information.'],['⌘','Local knowledge','Helpful recommendations to make Nairobi feel a little more familiar.']].map(x=>`<div class="service-card"><div class="service-icon">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join('')}</div></div></section><section class="section"><div class="container quote-grid"><div><div class="eyebrow">Hospitality, thoughtfully done</div><h2>Here for the whole stay.</h2><p>From the first enquiry to check-out, we aim to make the experience feel considered and personal.</p></div><div class="quote-card"><div class="stars">★★★★★</div><blockquote>“A beautiful, comfortable apartment and communication that made everything simple. I’d happily stay again.”</blockquote><div class="person">Guest review <small>Nairobi, Kenya</small></div></div></div></section><section class="section" style="padding-top:0"><div class="container"><div class="cta-band"><div><h2>Find your place in Nairobi.</h2><p>Take a look around and find a stay that fits your trip.</p></div><a class="btn" href="#stays" data-page="stays">View all stays ↗</a></div></div></section></main>`}
function experiences(){let list=guides.filter(g=>state.guideFilter==='All'||g.cat===state.guideFilter).filter(g=>(!state.guideQ||(g.title+' '+g.cat+' '+g.desc).toLowerCase().includes(state.guideQ.toLowerCase())));return `<main><section class="page-hero"><div class="container"><div><div class="eyebrow">A local’s point of view</div><h1>Make a little room<br>for Nairobi.</h1><p>Neighbourhood favourites, new discoveries and local experiences to help you find your own rhythm in the city.</p></div></div></section><section class="section"><div class="container"><div class="filter-bar"><input id="guide-q" placeholder="Search guides and recommendations…" value="${state.guideQ||''}"><select id="guide-cat">${['All','Food','Entertainment','Nightlife','Activities','Shopping','Attractions'].map(c=>`<option ${state.guideFilter===c?'selected':''}>${c}</option>`).join('')}</select><span class="results-count">${list.length} guides</span></div><div class="article-grid">${list.map(g=>`<article class="article-card"><a href="#guide/${g.id}" data-guide="${g.id}"><div class="property-image">${img(g.img,g.title)}</div></a><div class="property-body"><div class="article-tag">${g.cat} · Nairobi guide</div><h3 style="margin-top:8px"><a href="#guide/${g.id}" data-guide="${g.id}">${g.title}</a></h3><p>${g.desc}</p><a class="text-link" href="#guide/${g.id}" data-guide="${g.id}">Read the guide ↗</a></div></article>`).join('')}</div></div></section><section class="section" style="padding-top:0"><div class="container"><div class="cta-band"><div><h2>Stay close to what you love.</h2><p>Explore our apartments and choose a neighbourhood that suits your plans.</p></div><a class="btn" href="#stays" data-page="stays">Find a stay ↗</a></div></div></section></main>`}
function guideDetail(id){let g=guides.find(x=>x.id===id)||guides[0];let content={food:['Start with a table','Nairobi’s food scene is best explored with curiosity. From relaxed brunch spots and cafés to Kenyan dishes and special-occasion dinners, there’s something for every kind of day.','Ask your host or our team for current local recommendations, and check opening times before setting off.'],culture:['Find your own kind of night','As the city settles into evening, Nairobi offers everything from intimate live-music rooms to rooftop drinks and lively restaurants. Choose your mood and plan your journey home.','For a smooth evening, confirm event schedules in advance and use a trusted transport option.'],wild:['A little wilderness, not far away','One of Nairobi’s special qualities is how quickly the city can give way to open space and wildlife. A visit to Nairobi National Park or a conservation experience can make a memorable day.','Check official attraction information for opening hours, tickets, access and any seasonal changes before travelling.'],shop:['Bring a little Nairobi home','Explore a mix of shopping centres, independent shops, artisan markets and locally made pieces. Leave time to browse and discover items you won’t find anywhere else.','Market days and vendor availability vary, so check current details and carry a suitable payment option.'],activity:['Make the most of a free day','Balance your city plans with a walk, a nature outing or an experience that takes you somewhere new. Nairobi has plenty to offer whether you prefer active adventures or an unhurried afternoon.','Check weather, travel times and advance booking requirements for the activity you choose.'],entertainment:['Discover the creative side of the city','Galleries, performances, pop-ups and cultural spaces offer another way to get to know Nairobi. Keep an eye on current listings and build a little flexibility into your plans.','Schedules change regularly. Check venue websites or official social pages for up-to-date event information.']}[g.id];return `<main><section class="page-hero"><div class="container"><div><div class="eyebrow">Nairobi guide · ${g.cat}</div><h1>${g.title}.</h1><p>${g.desc}</p></div><a class="btn" href="#experiences" data-page="experiences">All city guides ↗</a></div></section><article class="section"><div class="container article-layout"><div class="article-cover">${img(g.img,g.title)}</div><p class="eyebrow">The Pretty Fly local edit</p><h2>${content[0]}</h2><p>${content[1]}</p><p>${content[2]}</p><h2>Make it part of your stay</h2><p>Whether you are visiting for a few days or getting to know the city over a longer stay, leave space for the places and experiences that make Nairobi yours. Our team can help point you in the right direction.</p><div class="cta-band" style="margin-top:30px"><div><h2>Make Nairobi your own.</h2><p>Find a comfortable base for your next city adventure.</p></div><a class="btn" href="#stays" data-page="stays">Explore our stays ↗</a></div><p style="margin-top:25px"><a class="text-link" href="#experiences" data-page="experiences">← Back to all guides</a></p></div></article></main>`}
function management(){return `<main><section class="page-hero"><div class="container"><div><div class="eyebrow">For property owners</div><h1>Your property.<br>Our expertise.</h1><p>Thoughtful, end-to-end property management designed to make hosting simpler and your property work harder.</p></div><a class="btn" href="#owner-enquiry">Talk to our team ↗</a></div></section><section class="section"><div class="container split"><div><div class="eyebrow">A more considered way to host</div><h2>Better care for your property. Less on your plate.</h2><p>Managing a short-stay property takes time, attention and a great deal of coordination. Pretty Fly Living helps owners with the everyday details  -  from presenting the property well to supporting guests and keeping operations moving.</p><p>We tailor the conversation to your property, goals and preferred level of involvement. Service scope, fees and performance expectations are agreed before management begins.</p><a class="btn" href="#owner-enquiry">Discuss your property ↗</a></div><div class="split-image">${img('https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=1200&q=85','Beautifully staged apartment ready for guests')}</div></div></section><section class="section" style="background:#eeece3"><div class="container"><div class="section-head"><div><div class="eyebrow">Support from set-up to check-out</div><h2>Management that covers the details.</h2></div></div><div class="service-grid">${[['⌂','Listing creation & optimisation','Clear descriptions, considered imagery and listing presentation across suitable booking channels.'],['↗','Pricing & revenue support','Thoughtful rate reviews and calendar management based on season, demand and your goals.'],['♡','Guest communication','Enquiry handling, practical information and responsive support throughout the guest journey.'],['⌑','Check-in & check-out','Coordinated arrival and departure processes with clear guest instructions.'],['✳','Cleaning & maintenance','Cleaning coordination, property checks and maintenance follow-up with agreed providers.'],['★','Reviews & channel management','Guest feedback support and management of Airbnb, Booking.com and other agreed channels.']].map(x=>`<div class="service-card"><div class="service-icon">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join('')}</div></div></section><section class="section"><div class="container"><div class="section-head"><div><div class="eyebrow">A clear process</div><h2>From first conversation to better hosting.</h2></div></div><div class="steps">${[['Get to know your property','We learn about the home, your objectives and what matters to you.'],['Build the right plan','We agree on services, responsibilities, reporting and fees.'],['Prepare to host','We coordinate listing details, guest information and operational readiness.'],['Manage and improve','We stay close to the details and review what can work better.']].map(x=>`<div class="step"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div></div></section><section class="section" style="padding-top:0"><div class="container contact-grid" id="owner-enquiry"><div><div class="eyebrow">Let’s talk property</div><h2>Tell us what you have in mind.</h2><p>Share a few details about your property and we’ll get back to you to discuss whether we’re a good fit.</p><div class="contact-method"><div class="service-icon">⌂</div><div><strong>Made for your property</strong><p>We’ll talk through your goals, property type and management needs.</p></div></div><div class="contact-method"><div class="service-icon">↗</div><div><strong>Clear next steps</strong><p>Scope, responsibilities and fees are discussed before any agreement.</p></div></div></div><form id="owner-form"><div class="form-grid"><div class="form-group"><label for="owner-name">Your name *</label><input id="owner-name" name="name" required placeholder="Full name"></div><div class="form-group"><label for="owner-email">Email *</label><input id="owner-email" name="email" type="email" required placeholder="you@example.com"></div><div class="form-group"><label for="owner-phone">Phone / WhatsApp *</label><input id="owner-phone" name="phone" required placeholder="+254…"></div><div class="form-group"><label for="owner-area">Property location *</label><input id="owner-area" name="location" required placeholder="e.g. Kilimani"></div><div class="form-group"><label for="owner-type">Property type</label><select id="owner-type" name="type"><option>Apartment</option><option>House / villa</option><option>Studio</option><option>Other</option></select></div><div class="form-group"><label for="owner-count">Number of units</label><select id="owner-count" name="units"><option>1</option><option>2–5</option><option>6–10</option><option>11+</option></select></div><div class="form-group full"><label for="owner-message">What would you like help with?</label><textarea id="owner-message" name="message" placeholder="Tell us about your property and goals…"></textarea></div><div class="form-group full"><button class="btn" type="submit">Send property enquiry ↗</button><div class="form-status" id="owner-status"></div></div></div></form></div></section></main>`}
const faqData={Guests:[['How do I book a stay?','Browse our available properties and submit a booking request with your preferred dates and contact details. Our team will check availability and contact you to confirm the next steps.'],['Is my booking confirmed when I send a request?','No. A request is an enquiry only. Your reservation is confirmed after our team has checked availability and explicitly confirmed the booking with you.'],['Can I book for a month or longer?','Many stays can accommodate extended visits. Share your dates and requirements so we can confirm the suitable options and rates.'],['What is included in the apartment?','Each listing describes its amenities. If something specific matters to your stay, please ask us before confirming.'],['How do I check in?','Arrival instructions and access details are shared once your reservation is confirmed.'],['Can I change my dates?','Please contact us as soon as possible. Changes depend on availability and the terms agreed for your reservation.']], 'Property Owners':[['What does property management include?','Services can include listing set-up, pricing support, guest communication, check-in and check-out coordination, cleaning and maintenance coordination, reviews and booking-channel management. The scope is agreed with each owner.'],['Do you manage Airbnb and Booking.com listings?','We can discuss management across Airbnb, Booking.com and other relevant channels, depending on your property and the agreed scope.'],['How are fees calculated?','Fees and any additional operating costs are discussed transparently during the property assessment and documented before work begins.'],['Can I still use my property personally?','Owner stays and calendar blocks can be discussed as part of the management plan. Dates must be coordinated with existing reservations.'],['How do you handle repairs?','We coordinate maintenance according to the agreed process and approval limits. Larger or unexpected costs should be discussed with the owner.'],['How do I get started?','Send an enquiry through our property management form. We’ll learn about your property and arrange a conversation about your goals.']]};
function faqs(){let items=faqData[state.faq]||faqData.Guests;return `<main><section class="page-hero"><div class="container"><div><div class="eyebrow">A few helpful answers</div><h1>Good to know.</h1><p>Find answers about staying with us or having Pretty Fly Living manage your property.</p></div><a class="btn" href="#contact" data-page="contact">Still have a question? ↗</a></div></section><section class="section"><div class="container faq-wrap"><aside><div class="eyebrow" style="margin:10px 0">Browse by topic</div><div class="faq-tabs"><button data-faq="Guests" class="${state.faq==='Guests'?'active':''}">For guests</button><button data-faq="Property Owners" class="${state.faq==='Property Owners'?'active':''}">For property owners</button></div><div style="margin-top:28px;padding:18px;background:var(--sage2);border-radius:14px"><h3>Need a human answer?</h3><p style="font-size:11px">We’re happy to help with the details.</p><a class="text-link" href="#contact" data-page="contact">Contact our team ↗</a></div></aside><div><div class="eyebrow">${state.faq==='Guests'?'Your stay':'Property management'}</div><h2 style="font-size:35px">${state.faq==='Guests'?'Questions about staying?':'Questions about your property?'}</h2>${items.map(x=>`<details class="accordion"><summary>${x[0]}</summary><p>${x[1]}</p></details>`).join('')}</div></div></section></main>`}
function contact(){return `<main><section class="page-hero"><div class="container"><div><div class="eyebrow">We’re here to help</div><h1>Let’s talk.</h1><p>Planning a stay, have a question, or considering professional property management? Tell us what you need.</p></div></div></section><section class="section"><div class="container contact-grid"><div><div class="eyebrow">Get in touch</div><h2>Good conversations start here.</h2><p>Choose the enquiry that fits best and our team will help you with the next step.</p><div class="contact-method"><div class="service-icon">◉</div><div><strong>WhatsApp</strong><p>Quick questions and stay enquiries.</p><a class="text-link" href="https://wa.me/254700000000" target="_blank" rel="noopener">Start a WhatsApp chat ↗</a></div></div><div class="contact-method"><div class="service-icon">✉</div><div><strong>Email</strong><p>hello@prettyflyliving.com</p><a class="text-link" href="mailto:hello@prettyflyliving.com">Send an email ↗</a></div></div><div class="contact-method"><div class="service-icon">⌂</div><div><strong>Based in Nairobi</strong><p>Serving guests and property owners in Nairobi, Kenya.</p></div></div><div style="margin-top:24px"><h3>Looking for a place to stay?</h3><a class="btn btn-light" href="#stays" data-page="stays">Browse all stays ↗</a></div></div><form id="contact-form"><div class="eyebrow">Send an enquiry</div><h2 style="font-size:34px">How can we help?</h2><div class="form-grid"><div class="form-group full"><label for="contact-type">I’m enquiring about *</label><select id="contact-type" name="type"><option>Booking a stay</option><option>Property management</option><option>General question</option></select></div><div class="form-group"><label for="contact-name">Your name *</label><input id="contact-name" name="name" required placeholder="Full name"></div><div class="form-group"><label for="contact-email">Email *</label><input id="contact-email" name="email" type="email" required placeholder="you@example.com"></div><div class="form-group full"><label for="contact-phone">Phone / WhatsApp</label><input id="contact-phone" name="phone" placeholder="+254…"></div><div class="form-group full"><label for="contact-message">Your message *</label><textarea id="contact-message" name="message" required placeholder="Tell us a little about what you need…"></textarea></div><div class="form-group full"><button class="btn" type="submit">Send enquiry ↗</button><div class="form-status" id="contact-status"></div><p style="font-size:10px;margin-top:12px">Demo form: connect an email service or backend before publishing to receive submissions.</p></div></div></form></div></section></main>`}
function render(){let hash=location.hash.slice(1)||'home',parts=hash.split('/');state.page=parts[0];let page=parts[0],body=page==='home'?home():page==='stays'?stays():page==='property'?detail(parts[1]):page==='why-us'?why():page==='experiences'?experiences():page==='guide'?guideDetail(parts[1]):page==='management'?management():page==='faqs'?faqs():page==='contact'?contact():home();document.getElementById('app').innerHTML=header()+body+footer();document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.dataset.page===page));if(page==='property')buildCalendar();window.scrollTo({top:0,behavior:'instant'});}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),2800)}
function buildCalendar(){let el=document.getElementById('calendar');if(!el)return;let d=new Date();let first=new Date(d.getFullYear(),d.getMonth(),1).getDay();let days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();let html=['S','M','T','W','T','F','S'].map(x=>`<span class="day-label">${x}</span>`).join('');for(let i=0;i<first;i++)html+='<span></span>';for(let n=1;n<=days;n++){let blocked=[4,9,15,22,27].includes(n);html+=`<button type="button" class="${blocked?'blocked':''}" ${blocked?'disabled':''} data-date="${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(n).padStart(2,'0')}">${n}</button>`}el.innerHTML=html;}
function modal(content,cls=''){let m=document.getElementById('modal');m.className='modal open '+cls;document.getElementById('modal-inner').innerHTML=content;}
document.addEventListener('click',e=>{let pageLink=e.target.closest('[data-page]');if(pageLink){e.preventDefault();location.hash=pageLink.dataset.page;document.getElementById('nav')?.classList.remove('open');return}let prop=e.target.closest('[data-property]');if(prop){location.hash='property/'+prop.dataset.property;return}let openProp=e.target.closest('[data-open-property]');if(openProp){location.hash='property/'+openProp.dataset.openProperty;return}let guide=e.target.closest('[data-guide]');if(guide){e.preventDefault();location.hash='guide/'+guide.dataset.guide;return}let save=e.target.closest('[data-save]');if(save){e.preventDefault();let id=save.dataset.save;state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):[...state.saved,id];save.classList.toggle('saved');save.textContent=state.saved.includes(id)?'♥':'♡';toast(state.saved.includes(id)?'Saved to your favourites':'Removed from favourites');return}let im=e.target.closest('[data-image]');if(im){modal(`<button class="modal-close" data-action="close-modal" aria-label="Close">×</button>${img(im.dataset.image,'Property photo')}`,'image-modal');return}let f=e.target.closest('[data-faq]');if(f){state.faq=f.dataset.faq;render();return}let date=e.target.closest('[data-date]');if(date){let input=document.getElementById('book-in');if(input)input.value=date.dataset.date;document.querySelectorAll('[data-date]').forEach(b=>b.classList.remove('selected'));date.classList.add('selected');return}let action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;if(action==='menu')document.getElementById('nav').classList.toggle('open');if(action==='close-modal'){document.getElementById('modal').className='modal'}if(action==='whatsapp'){window.open('https://wa.me/254700000000?text='+encodeURIComponent('Hello Pretty Fly Living, I would like to make an enquiry.'),'_blank','noopener')}if(action==='whatsapp-property'){let p=properties.find(x=>x.id===e.target.closest('[data-pid]')?.dataset.pid)||properties[0];window.open('https://wa.me/254700000000?text='+encodeURIComponent('Hello Pretty Fly Living, I am interested in '+p.name+' in '+p.area+'. Could you please share availability and rates?'),'_blank','noopener')}if(action==='reset-filters'){state.filter={q:'',area:'All locations',beds:'Any bedrooms',sort:'featured',max:10000};render()}if(action==='scroll-booking'){document.querySelector('.booking-card')?.scrollIntoView({behavior:'smooth',block:'center'})}});
document.addEventListener('submit',e=>{if(e.target.id==='home-search'){e.preventDefault();state.filter.area=document.getElementById('s-location').value;state.filter.q='';state.filter.beds='Any bedrooms';state.filter.max=10000;location.hash='stays';return}if(e.target.id==='booking-form'){e.preventDefault();let p=properties.find(x=>x.id===e.target.dataset.pid);let start=document.getElementById('book-in').value,end=document.getElementById('book-out').value;let status=document.getElementById('booking-status');if(!start||!end||end<=start){status.textContent='Please choose a check-out date after your check-in date.';status.classList.add('show');return}let msg=`Hello Pretty Fly Living, I'd like to request a stay at ${p.name} (${p.area}). Check-in: ${start}; check-out: ${end}; guests: ${document.getElementById('book-guests').value}. Name: ${document.getElementById('book-name').value}. Contact: ${document.getElementById('book-email').value}. Please confirm availability and total price.`;status.textContent='Your request is ready. Continue to WhatsApp to send it to the team. This is not a confirmed reservation.';status.classList.add('show');let go=document.createElement('button');go.type='button';go.className='btn';go.style.width='100%';go.style.marginTop='10px';go.textContent='Send request on WhatsApp ↗';go.onclick=()=>window.open('https://wa.me/254700000000?text='+encodeURIComponent(msg),'_blank','noopener');status.appendChild(go);return}if(['contact-form','owner-form'].includes(e.target.id)){e.preventDefault();let id=e.target.id==='owner-form'?'owner-status':'contact-status';let el=document.getElementById(id);let data=Object.fromEntries(new FormData(e.target).entries());let lines=Object.entries(data).map(([k,v])=>k+': '+v).join('\n');let subject=e.target.id==='owner-form'?'Property management enquiry':'Pretty Fly Living enquiry';el.innerHTML='Your enquiry is prepared. Send it to our team using WhatsApp, or email us.';el.classList.add('show');let w=document.createElement('button');w.className='btn';w.type='button';w.style.marginTop='10px';w.textContent='Send via WhatsApp ↗';w.onclick=()=>window.open('https://wa.me/254700000000?text='+encodeURIComponent(subject+'\n'+lines),'_blank','noopener');el.appendChild(w);let a=document.createElement('a');a.className='btn btn-light';a.style.margin='10px 0 0 8px';a.href='mailto:hello@prettyflyliving.com?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(lines);a.textContent='Open email ↗';el.appendChild(a);return}});
document.addEventListener('change',e=>{if(e.target.id==='filter-area')state.filter.area=e.target.value;if(e.target.id==='filter-beds')state.filter.beds=e.target.value;if(e.target.id==='filter-max')state.filter.max=+e.target.value;if(e.target.id==='filter-sort')state.filter.sort=e.target.value;if(['filter-area','filter-beds','filter-max','filter-sort'].includes(e.target.id)){render();return}if(e.target.id==='guide-cat'){state.guideFilter=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.id==='filter-q'){state.filter.q=e.target.value;let pos=e.target.selectionStart;let pageY=window.scrollY;let grid=document.getElementById('listing-grid');let list=properties.filter(p=>(!state.filter.q||(p.name+' '+p.area+' '+p.type).toLowerCase().includes(state.filter.q.toLowerCase()))&&(state.filter.area==='All locations'||p.area===state.filter.area)&&(state.filter.beds==='Any bedrooms'||p.beds>=+state.filter.beds)&&p.price<=state.filter.max);if(state.filter.sort==='price-low')list.sort((a,b)=>a.price-b.price);if(state.filter.sort==='price-high')list.sort((a,b)=>b.price-a.price);grid.innerHTML=list.length?list.map(card).join(''):`<div class="empty-state"><h3>No stays found just yet</h3><p>Try another search.</p></div>`;document.querySelector('.results-count').textContent=list.length+' stays';let q=document.getElementById('filter-q');q.focus();q.setSelectionRange(pos,pos);window.scrollTo(0,pageY)}if(e.target.id==='guide-q'){state.guideQ=e.target.value;let pos=e.target.selectionStart;render();let q=document.getElementById('guide-q');q?.focus();q?.setSelectionRange(pos,pos)}});
window.addEventListener('hashchange',render);document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')e.currentTarget.className='modal'});render();
</script></body></html>
